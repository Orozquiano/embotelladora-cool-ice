name: GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration=github-pages

      - name: Prepare SPA fallback
        run: |
          cp dist/embotelladora-cool-ice/browser/index.html dist/embotelladora-cool-ice/browser/404.html
          touch dist/embotelladora-cool-ice/browser/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/embotelladora-cool-ice/browser
          force_orphan: true
          commit_message: 'Deploy site from master'
