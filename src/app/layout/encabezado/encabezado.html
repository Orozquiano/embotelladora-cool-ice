<header class="encabezado">
  <div class="encabezado__barra">
    <a
      class="encabezado__marca"
      routerLink="/"
      fragment="inicio"
      aria-label="Cool Ice, ir al inicio"
      [attr.tabindex]="menuAbierto() ? -1 : null"
      [attr.aria-hidden]="menuAbierto() ? 'true' : null"
      (click)="cerrarMenu()"
    >
      <img
        class="encabezado__logo"
        [ngSrc]="logo.ruta"
        [width]="logo.ancho"
        [height]="logo.alto"
        alt=""
        priority
      />
    </a>

    <button
      #botonMenu
      type="button"
      class="encabezado__abrir"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-principal"
      (click)="alternarMenu()"
    >
      <span class="solo-lectores">{{ menuAbierto() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span class="hamburguesa" [class.hamburguesa--abierta]="menuAbierto()" aria-hidden="true">
        <span></span>
      </span>
    </button>
  </div>

  <nav id="menu-principal" class="menu" [class.menu--abierto]="menuAbierto()" aria-label="Secciones">
    <div class="menu__panel">
      <p class="menu__titulo" id="titulo-menu-movil">Secciones</p>
      <ul class="menu__lista" aria-labelledby="titulo-menu-movil">
        @for (seccion of secciones; track seccion.id) {
          <li>
            <a
              class="menu__enlace"
              routerLink="/"
              [fragment]="seccion.id"
              [attr.aria-current]="seccionActiva() === seccion.id ? 'location' : null"
              (click)="cerrarMenu()"
            >
              {{ seccion.etiqueta }}
            </a>
          </li>
        }
      </ul>
      <div class="menu__acciones">
        <a class="boton boton--whatsapp" [href]="whatsapp" target="_blank" rel="noopener noreferrer">
          Pedir por WhatsApp
          <span class="solo-lectores">de pedidos, se abre en una pestaña nueva</span>
        </a>
      </div>
    </div>
  </nav>
</header>
