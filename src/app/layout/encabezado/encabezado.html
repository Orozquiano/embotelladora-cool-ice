<header class="encabezado" [class.encabezado--menu-abierto]="menuAbierto()">
  <div class="encabezado__barra">
    <a
      class="encabezado__marca"
      routerLink="/"
      aria-label="Cool Ice, ir al inicio"
      [attr.tabindex]="menuAbierto() ? -1 : null"
      [attr.aria-hidden]="menuAbierto() ? 'true' : null"
      (click)="irAlInicio($event)"
    >
      <img
        class="encabezado__logo"
        [ngSrc]="logo.ruta"
        [width]="logo.ancho"
        [height]="logo.alto"
        alt=""
        priority
      />
    </a>

    <div class="encabezado__acciones">
      <button
        type="button"
        class="encabezado__tema"
        [attr.data-preferencia]="preferenciaTema()"
        [attr.aria-label]="
          'Cambiar apariencia. Actual: ' +
          etiquetaTema() +
          '. Efectiva: ' +
          (aparienciaTema() === 'oscuro' ? 'oscura' : 'clara')
        "
        (click)="alternarTema()"
      >
        <span class="encabezado__tema-icono" aria-hidden="true">
          @switch (preferenciaTema()) {
            @case ('claro') {
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <circle cx="12" cy="12" r="3.6" fill="currentColor" />
                <g
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                >
                  <path d="M12 2.6v2.1M12 19.3v2.1M4.7 4.7l1.5 1.5M17.8 17.8l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.7 19.3l1.5-1.5M17.8 6.2l1.5-1.5" />
                </g>
              </svg>
            }
            @case ('oscuro') {
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M15.8 3.2a8.6 8.6 0 1 0 5 13.4 7.4 7.4 0 1 1-5-13.4Z"
                />
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <circle
                  cx="12"
                  cy="12"
                  r="7.25"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path fill="currentColor" d="M12 4.75a7.25 7.25 0 0 0 0 14.5Z" />
              </svg>
            }
          }
        </span>
        <span class="encabezado__tema-texto">{{ etiquetaTema() }}</span>
      </button>

      <button
        #botonMenu
        type="button"
        class="encabezado__abrir"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-principal"
        (click)="alternarMenu()"
      >
        <span class="solo-lectores">{{ menuAbierto() ? 'Cerrar menú' : 'Abrir menú' }}</span>
        <span class="hamburguesa" [class.hamburguesa--abierta]="menuAbierto()" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>

  <nav
    id="menu-principal"
    class="menu"
    [class.menu--abierto]="menuAbierto()"
    aria-label="Secciones"
    (click)="cerrarMenu()"
  >
    <div class="menu__panel" (click)="$event.stopPropagation()">
      <div class="menu__cabecera" id="titulo-menu-movil">
        <div class="menu__cabecera-texto">
          <p class="menu__titulo">Secciones</p>
          <p class="menu__ubicacion">
            Ahora en
            <strong>{{ etiquetaActiva() }}</strong>
          </p>
        </div>
        <button type="button" class="menu__cerrar" (click)="cerrarMenu()">
          Cerrar
        </button>
      </div>
      <ul class="menu__lista" aria-labelledby="titulo-menu-movil">
        @for (seccion of secciones; track seccion.id) {
          <li>
            <a
              class="menu__enlace"
              routerLink="/"
              [fragment]="seccion.id"
              [attr.aria-current]="seccionActiva() === seccion.id ? 'location' : null"
              (click)="cerrarMenu(true)"
            >
              <span>{{ seccion.etiqueta }}</span>
              @if (seccionActiva() === seccion.id) {
                <span class="menu__estado">Aquí</span>
              }
            </a>
          </li>
        }
      </ul>
      <div class="menu__acciones">
        <a class="boton boton--whatsapp" [href]="whatsapp" target="_blank" rel="noopener noreferrer">
          Pedir por WhatsApp
          <span class="solo-lectores">, canal de pedidos; se abre en una pestaña nueva</span>
        </a>
      </div>
    </div>
  </nav>
</header>
