<header class="encabezado" [class.encabezado--menu-abierto]="menuAbierto()">
  <div class="encabezado__barra">
    <a
      class="encabezado__marca"
      routerLink="/"
      fragment="inicio"
      aria-label="Cool Ice, ir al inicio"
      [attr.tabindex]="menuAbierto() ? -1 : null"
      [attr.aria-hidden]="menuAbierto() ? 'true' : null"
      (click)="cerrarMenu(true)"
    >
      <img
        class="encabezado__logo"
        [ngSrc]="logo.ruta"
        [width]="logo.ancho"
        [height]="logo.alto"
        alt=""
        priority
      />
    </a>

    <button
      #botonMenu
      type="button"
      class="encabezado__abrir"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-principal"
      (click)="alternarMenu()"
    >
      <span class="solo-lectores">{{ menuAbierto() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span class="hamburguesa" [class.hamburguesa--abierta]="menuAbierto()" aria-hidden="true">
        <span></span>
      </span>
    </button>
  </div>

  <nav
    id="menu-principal"
    class="menu"
    [class.menu--abierto]="menuAbierto()"
    aria-label="Secciones"
    (click)="cerrarMenu()"
  >
    <div class="menu__panel" (click)="$event.stopPropagation()">
      <div class="menu__cabecera" id="titulo-menu-movil">
        <div class="menu__cabecera-texto">
          <p class="menu__titulo">Secciones</p>
          <p class="menu__ubicacion">
            Ahora en
            <strong>{{ etiquetaActiva() }}</strong>
          </p>
        </div>
        <button type="button" class="menu__cerrar" (click)="cerrarMenu()">
          Cerrar
        </button>
      </div>
      <ul class="menu__lista" aria-labelledby="titulo-menu-movil">
        @for (seccion of secciones; track seccion.id) {
          <li>
            <a
              class="menu__enlace"
              routerLink="/"
              [fragment]="seccion.id"
              [attr.aria-current]="seccionActiva() === seccion.id ? 'location' : null"
              (click)="cerrarMenu(true)"
            >
              <span>{{ seccion.etiqueta }}</span>
              @if (seccionActiva() === seccion.id) {
                <span class="menu__estado">Aquí</span>
              }
            </a>
          </li>
        }
      </ul>
      <div class="menu__acciones">
        <a class="boton boton--whatsapp" [href]="whatsapp" target="_blank" rel="noopener noreferrer">
          Pedir por WhatsApp
          <span class="solo-lectores">de pedidos, se abre en una pestaña nueva</span>
        </a>
      </div>
    </div>
  </nav>
</header>
