<section id="proceso" class="seccion" aria-labelledby="titulo-proceso" tabindex="-1">
  <div class="contenido">
    <header class="seccion__cabecera seccion__cabecera--centrada">
      <p class="seccion__marca">Calidad garantizada</p>
      <h2 id="titulo-proceso">Proceso de purificación</h2>
      <p class="prosa">
        Cada etapa está pensada para entregar agua segura, cristalina y con el estándar que tu
        familia merece.
      </p>
    </header>

    <div class="rejilla rejilla--cuatro">
      @for (etapa of etapas; track etapa.numero) {
        <article class="tarjeta tarjeta--etapa">
          <span class="tarjeta__numero" aria-hidden="true">{{ etapa.numero }}</span>
          <h3 class="tarjeta__titulo">{{ etapa.titulo }}</h3>
          <p>{{ etapa.texto }}</p>
        </article>
      }
    </div>
  </div>
</section>
